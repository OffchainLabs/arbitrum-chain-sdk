name: Publish Docker Image

on:
  workflow_call:
    inputs:
      publish:
        description: 'Publish the image after the caller verifies release eligibility'
        type: boolean
        default: false

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image and publish if eligible
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          tags: |
            ghcr.io/offchainlabs/arbitrum-chain-sdk:latest
            ghcr.io/offchainlabs/arbitrum-chain-sdk:${{ github.sha }}
            ${{ github.event_name == 'push' && format('ghcr.io/offchainlabs/arbitrum-chain-sdk:{0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
